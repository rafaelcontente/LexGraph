name: eval-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # necessario para ler a tag de congelamento

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Testes
        run: python -m pytest -q

      - name: Verificar congelamento das perguntas
        run: python scripts/verificar_congelamento.py
